[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo26m-pwl-attention-portable"
version = "1.0.0"
description = "Portable YOLO26m Binary-QK and Bit-True PWL training package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "torch==2.11.0",
  "ultralytics==8.4.90",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
yolo-attention = "yolo_attention.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["yolo_attention*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
