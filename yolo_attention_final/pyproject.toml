[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo26m-pwl-attention-final"
version = "0.1.0"
description = "Reproducible final-weight training for YOLO26m PWL attention"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "PyYAML>=6.0", "torch>=2.2", "ultralytics>=8.4.90"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
yolo-attention = "yolo_attention.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
