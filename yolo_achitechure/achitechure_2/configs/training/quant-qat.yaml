# Q2 只適用於使用者核准的 quantization_eligible 候選，且必須另行允許 GPU。
schema_version: 3
spec_version: 2.3.0
spec_sha256: 572e10ef85037a4520083a0508688b7f88cd6fc7c11541530a1ef43644599216
kind: training_template
config_id: quant-qat
title_zh: Q2 W8A8 QAT simulation
summary_zh: 從該候選 Q0/Q1 lineage 建立；沿用 winner recipe 並使用 0.1 倍 LR。
phase: C
status: blocked_until_user_quantization_selection_and_gpu_authorization
model_scale: m
candidate_policy:
  base_candidates: [C0, C1, C2, C3]
  resolved_from_handoff: true
  same_recipe_for_all: true
  requires_quantization_eligible: true
execution:
  device: "0"
  force_cuda_hidden: false
  requires_execute_flag: true
  requires_gpu_authorization: true
  pose_opt_in_required: true
  formal_training: true
routes:
  detect:
    enabled_by_default: true
    loss_on_dataset: coco2017
  pose:
    enabled_by_default: false
    loss_on_dataset: bbat5-pose
formal_ranking_requires: [detect, pose]
datasets:
  detect: configs/data/coco2017.yaml
  pose: configs/data/bbat5-pose.yaml
  diagnostic_detect: configs/data/bbat5-detect.yaml
recipe:
  source: handoff
  task_ratio: {source: handoff, value: null}
  optimizer: {source: handoff, value: null}
  lr0: {source: derived, value: parent_lr0_times_0.1}
  lrf: {source: handoff, value: null}
  momentum: {source: handoff, value: null}
  weight_decay: {source: handoff, value: null}
  warmup_epochs: {source: handoff, value: null}
  nbs: {source: handoff, value: null}
  losses: {source: handoff, value: null}
  augmentation: {source: handoff, value: null}
  freeze_policy: {source: handoff, value: null}
  amp: {source: handoff, value: null}
  deterministic: {source: handoff, value: null}
  seed: {source: local, value: 0}
  optimizer_steps: {source: handoff, value: null}
  validation_interval: {source: handoff, value: null}
adjustable:
  batch: {source: handoff, value: null}
  fraction: {source: local, value: 1.0}
  scale: {source: handoff, value: null}
  cache: {source: local, value: false}
  imgsz: {source: handoff, value: null}
  device: {source: local, value: "0"}
  workers: {source: local, value: 8}
  epochs: {source: handoff, value: null}
  patience: {source: handoff, value: null}
validation:
  selection_backend: w8a8_simulation
  metrics: [map50, map50_95, macro_f1, micro_f1]
  simulation_only: true
transition:
  mode: fresh
  input: candidate_qat_prepared_checkpoint
  optimizer_state: new
lineage:
  require_all_hashes: true
  effective_yaml_output: artifacts/effective-configs
