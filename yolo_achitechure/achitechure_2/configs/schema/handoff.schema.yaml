$schema: https://json-schema.org/draft/2020-12/schema
$id: handoff.schema.yaml
title: yolo_combine Winner Handoff Revision
description: architecture_2 只接受通過此契約且能在新程序重建的不可變 winner revision。
x-spec-version: 2.0.1
x-spec-sha256: 9897ece524fd62cd55e3afc46b6bd810abbef5858f75493d1a4ba895585a4f0c
type: object
additionalProperties: false
required:
  - schema_version
  - producer
  - revision_id
  - winner_id
  - fusion_kind
  - checkpoint_format
  - checkpoint
  - builder
  - architecture
  - training_recipe
  - datasets
  - selection
  - fresh_process_report
  - environment
  - model_contract
  - candidate_regions
  - protected_module_paths
  - frozen_module_paths
properties:
  schema_version:
    const: 2
  producer:
    const: yolo_combine
  revision_id:
    type: string
    minLength: 1
  winner_id:
    type: string
    minLength: 1
  fusion_kind:
    enum: [shared_dual_head, routed_dual, partial_shared]
  checkpoint_format:
    const: state_dict_only
  checkpoint:
    $ref: "#/$defs/artifact"
  builder:
    $ref: "#/$defs/artifact"
  architecture:
    $ref: "#/$defs/artifact"
  training_recipe:
    $ref: "#/$defs/artifact"
  datasets:
    type: object
    additionalProperties: false
    required: [coco_detect, bbat5_pose, bbat5_detect]
    properties:
      coco_detect:
        $ref: "#/$defs/artifact"
      bbat5_pose:
        $ref: "#/$defs/artifact"
      bbat5_detect:
        $ref: "#/$defs/artifact"
  selection:
    $ref: "#/$defs/artifact"
  fresh_process_report:
    $ref: "#/$defs/artifact"
  environment:
    type: object
    additionalProperties: false
    required: [torch, ultralytics, git_revision]
    properties:
      torch:
        type: string
        minLength: 1
      ultralytics:
        const: 8.4.90
      git_revision:
        type: string
        minLength: 1
  model_contract:
    type: object
    additionalProperties: false
    required:
      - interface
      - model_kind
      - head_inputs
      - detect_nc
      - pose_nc
      - kpt_shape
      - detect_names
      - pose_names
    properties:
      interface:
        const: "model(images, tasks=detect|pose|both)"
      model_kind:
        enum: [shared_dual_head, routed_dual, partial_shared]
      head_inputs:
        type: array
        minItems: 3
        maxItems: 3
        items:
          oneOf:
            - type: integer
            - type: string
              minLength: 1
      detect_nc:
        const: 80
      pose_nc:
        const: 2
      kpt_shape:
        const: [2, 3]
      detect_names:
        oneOf:
          - type: array
            minItems: 80
            maxItems: 80
            prefixItems:
              - const: person
            items:
              type: string
              minLength: 1
          - type: object
            minProperties: 80
            maxProperties: 80
            required: ["0"]
            propertyNames:
              pattern: "^(?:[0-9]|[1-6][0-9]|7[0-9])$"
            properties:
              "0":
                const: person
            additionalProperties:
              type: string
              minLength: 1
      pose_names:
        oneOf:
          - const: [ball, bat]
          - type: object
            additionalProperties: false
            required: ["0", "1"]
            properties:
              "0":
                const: ball
              "1":
                const: bat
  candidate_regions:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/candidate_region"
  protected_module_paths:
    $ref: "#/$defs/module_paths"
  frozen_module_paths:
    $ref: "#/$defs/module_paths"
$defs:
  artifact:
    type: object
    additionalProperties: false
    required: [path, sha256]
    properties:
      path:
        type: string
        minLength: 1
      sha256:
        type: string
        pattern: "^[0-9a-f]{64}$"
  module_paths:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
      pattern: "^[^.](?:.*[^.])?$"
  candidate_region:
    type: object
    additionalProperties: false
    required: [region_id, role, tasks, module_paths, head_paths]
    properties:
      region_id:
        type: string
        minLength: 1
      role:
        enum: [shared, detect_specific, pose_specific]
      tasks:
        oneOf:
          - const: [detect, pose]
          - const: [detect]
          - const: [pose]
      module_paths:
        $ref: "#/$defs/module_paths"
      head_paths:
        $ref: "#/$defs/module_paths"
