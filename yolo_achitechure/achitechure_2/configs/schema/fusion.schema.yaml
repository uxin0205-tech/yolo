# JSON Schema Draft 2020-12；可供外部 validator 使用。
$schema: https://json-schema.org/draft/2020-12/schema
$id: fusion.schema.yaml
title: architecture_2 雙來源融合契約
type: object
additionalProperties: false
required:
- schema_version
- spec_version
- spec_sha256
- kind
- title_zh
- summary_zh
- status
- enabled
- task
- source_a
- source_b
- dataset_yaml
- dataset_yaml_sha256
- training_yaml_sha256
- fusion_mode
- switch_policy
- allowed_future_modes
- standalone_loadable
properties:
  schema_version:
    const: 2
  spec_version:
    const: 1.2.0
  spec_sha256:
    type: string
    pattern: ^[0-9a-f]{64}$
  kind:
    const: fusion_source_pair_template
  title_zh:
    type: string
  summary_zh:
    type: string
  status:
    const: future_disabled
  enabled:
    const: false
  task:
    type:
    - string
    - 'null'
  source_a:
    $ref: '#/$defs/source'
  source_b:
    $ref: '#/$defs/source'
  dataset_yaml:
    type:
    - string
    - 'null'
  dataset_yaml_sha256:
    type:
    - string
    - 'null'
  training_yaml_sha256:
    type:
    - string
    - 'null'
  fusion_mode:
    type: 'null'
  switch_policy:
    type: 'null'
  allowed_future_modes:
    const:
    - weight_interpolation
    - ensemble
    - routed_switch
    - staged_transfer
  standalone_loadable:
    const: false
$defs:
  source:
    type: object
    additionalProperties: false
    required:
    - role
    - checkpoint
    - checkpoint_sha256
    - architecture_yaml
    - architecture_yaml_sha256
    - head_contract
    properties:
      role:
        type:
        - string
        - 'null'
      checkpoint:
        type:
        - string
        - 'null'
      checkpoint_sha256:
        type:
        - string
        - 'null'
      architecture_yaml:
        type:
        - string
        - 'null'
      architecture_yaml_sha256:
        type:
        - string
        - 'null'
      head_contract:
        type:
        - string
        - 'null'
