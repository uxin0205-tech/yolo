# JSON Schema Draft 2020-12；可供外部 validator 使用。
$schema: https://json-schema.org/draft/2020-12/schema
$id: dataset.schema.yaml
title: architecture_2 資料集設定
type: object
additionalProperties: false
required:
- schema_version
- spec_version
- spec_sha256
- kind
- project_metadata
- path
- train
- val
- names
properties:
  schema_version:
    const: 2
  spec_version:
    const: 1.2.0
  spec_sha256:
    type: string
    pattern: ^[0-9a-f]{64}$
  kind:
    const: dataset
  project_metadata:
    type: object
    additionalProperties: false
    required:
    - title_zh
    - summary_zh
    - task
    - ultralytics_dataset_yaml
    properties:
      title_zh:
        type: string
      summary_zh:
        type: string
      task:
        enum:
        - detect
        - pose
      ultralytics_dataset_yaml:
        const: true
  path:
    type: string
  train:
    type: string
  val:
    type: string
  test:
    type:
    - string
    - 'null'
  nc:
    type: integer
    minimum: 1
  names:
    type:
    - array
    - object
  kpt_shape:
    type: array
  flip_idx:
    type: array
  source_read_only:
    type: string
  group_key:
    type: string
  split_ratio:
    type: array
  split_seed:
    type: integer
