  handoff_example: {const: handoff-manifest.example.json}
  architectures:
    type: object
    minProperties: 4
    maxProperties: 4
  training:
    type: object
    minProperties: 4
    maxProperties: 4
  datasets:
    type: object
    minProperties: 3
    maxProperties: 3
  quantization: {const: configs/quant/w8a8-simulation.yaml}
  schemas:
    type: object
    minProperties: 6
    maxProperties: 6
