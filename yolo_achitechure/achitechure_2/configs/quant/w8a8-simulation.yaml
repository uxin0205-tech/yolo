# 正式量化模擬設定；C1–C3 需由使用者看完 Float 結果後明確核准。
schema_version: 3
spec_version: 2.3.0
spec_sha256: 572e10ef85037a4520083a0508688b7f88cd6fc7c11541530a1ef43644599216
kind: quantization
title_zh: 逐候選 Q0／Q1／Q2 W8A8 模擬
summary_zh: C0 固定 eligible；其他 resolved candidates 保持 pending_user_decision。
status: blocked_until_float_results_and_user_selection
simulation_only: true
eligibility:
  C0: true
  C1: pending_user_decision
  C2: pending_user_decision
  C3: pending_user_decision
stages:
  Q0:
    kind: fused_fp32_reference
    equivalence_max_abs_diff: 0.0001
  Q1:
    kind: w8a8_ptq_simulation
    calibration_set: fixed_from_c0_search_train
  Q2L:
    kind: w8a8_qat_lite_simulation
    prerequisite_stages: [Q0, Q1]
    training_template: configs/training/quant-qat-lite.yaml
    max_optimizer_steps: 200
    observer_update_steps: 50
    validation_interval_steps: 50
    requires_gpu_authorization: true
    screening_only: true
    automatic_acceptance: false
  Q2:
    kind: w8a8_qat_simulation
    requires_gpu_authorization: true
    recipe_source: handoff
    lr_ratio: 0.1
weight:
  dtype: int8
  qscheme: per_channel_symmetric
  ch_axis: 0
activation:
  dtype: int8
  qscheme: per_tensor_affine
include_standard_convs_in_masf: true
exclude_custom_roots: [HardwareFriendlyAttention]
