schema_version: 2
architecture: partial75
joint_config: joint.yaml
pose_stage_source: yolo_combine.pose_stages.POSE_STAGES

gpu_execution:
  performed_by_workspace_setup: false
  reason: Partial75 是停用備案，只有使用者明確要求才執行。

diagnostic_sampling:
  capability_available: true
  materialized: false
  executed: false
  default_if_user_enables:
    fraction: 0.3
    seed: 0
    strategy: seeded_random_source_group
    validation_fraction: 1.0
    formal_eligible: false

official_yolo26m_coco_reference:
  scope: reference_only
  task: detect
  dataset: COCO
  imgsz: 640
  published_batch: 128
  epochs: 80
  optimizer: MuSGD

local_detect_source:
  checkpoint: /home/uxin/yolo/yolo_achitechure/achitechure_1/final/weights/float/partial75-a2.pt
  physical_batch: 16
  nbs: 16
  configured_max_epochs: 10
  optimizer: MuSGD
  lr0: 0.00038
  lrf: 0.5

observed_full35_p1:
  applies_to_this_variant: false
  status: reference_from_full35_only
  run: artifacts/runs/p0/p0-full35-p1-seed0
  dataset: BBT5 basic split（僅歷史證據，不可作新 run 輸入）
  epochs: 10
  physical_batch: 16
  nbs: 64
  steady_state_accumulate: 4
  trainable_scope: fresh Pose26 head only

pose_schedule:
  batch_argument: 128
  nbs: 128
  effective_weight_decay: 0.00027
  optimizer: MuSGD
  lr0: 0.00038
  lrf: 0.5
  momentum: 0.948
  cosine: true
  p1:
    epochs: 17
    patience: 10
    trainable_scope: Pose26 head
  p2:
    epochs: 22
    patience: 12
    trainable_scope: neck、Pose26 head、MASF 與 attention 可訓練部分
  p3:
    epochs: 100
    trainable_scope: full graph；Q/K sign path、gamma、PWL/PoT constants 鎖定
    patience: 20
  transition_rule: each stage starts a new optimizer from the previous best checkpoint

batch_decision:
  status: locked_by_user
  selected:
    physical_batch: 128
    nbs: 128
    accumulate: 1
  rationale: nbs與physical batch相同，避免Ultralytics把weight decay由2.7e-4放大兩倍。
  validation_batch: independently capped
  xnor_backend: exact tiled token reduction
  xnor_token_tile: 32
  warning: Partial75 未啟用，也未執行任何 GPU profile。

seed_policy:
  required_first_seed: 0
  optional_second_seed: 1
  second_seed_condition: 時間允許且 seed0 通過逐項精度 gate
