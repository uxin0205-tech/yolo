[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activation-lab"
version = "0.1.0"
description = "Hardware-oriented activation prototypes for YOLO research"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "PyYAML>=6.0"]

[project.optional-dependencies]
validation = ["onnx>=1.14", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
