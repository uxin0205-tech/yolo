[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "masf-yolo-phase1"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "torch==2.11.0",
  "ultralytics==8.4.90",
  "faster-coco-eval==1.7.2",
  "PyYAML==6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
