  search:
    gpu: true
    maximum_cells: 30
    selection_contract: coco_val_plus_bbat_canonical_search_val
    includes_dominated_sentinels: true
    promotion_authority: true
  formal:
    gpu: true
    maximum_finalists: 6
    contract: locked_policies_full_coco_and_bbat_formal_val
    repeated_search_forbidden: true

