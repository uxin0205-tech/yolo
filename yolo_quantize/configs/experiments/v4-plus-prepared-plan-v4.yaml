    maximum_policies: 8
    composition: up_to_6_main_plus_2_preregistered_sentinels
  d20:
    epochs: 20
    maximum_policies: 3
    more_rounds_than_old_stage2: true
  d60:
    epochs: 60
    maximum_policies: 2
  formal_top2:
    train_fraction: 1.0
    epochs: [100, 120]
    seeds: [0, 1, 2]
  optimizer:
    control: AdamW
    pilot: MuSGD
    pilot_requires_new_matched_sham: true
    cross_optimizer_state_resume: forbidden
  hyperparameter_trials:
    maximum: 8
    adamw: 4
    musgd: 4
    model_lr_multipliers: [0.05, 0.1, 0.2]
    qparam_lr_ratios: [0.5, 1.0, 2.0]
    trial_epochs: [5, 10, 15]

lower_activation_stage:
