weight_formats:
  uniform:
    bits: [8, 7, 6, 5, 4]
    qrange: signed_full_range
    rounding: nearest_even
    accumulator: int32
    main_granularity: per_output_channel
    main_scale_method: mse
    ablation_granularities: [per_tensor, per_output_channel, group32, group64]
    ablation_scale_methods: [max, mse]
    native_kernel_claim: false
  fixed_sd4:
    bits: 4
    unique_values: 15
    encoded_codes: 16
    duplicate_zero_code: true
    normalized_codebook: [0, 0.015625, -0.015625, 0.03125, -0.03125, 0.0625, -0.0625, 0.125, -0.125, 0.25, -0.25, 0.5, -0.5, 1.0, -1.0]
    scale_methods: [max, mse]
    static_ptq: true
  ls_sd4:
    status: planned_qat_not_authorized
    codebook_fixed: true
    scale: softplus_rho_plus_epsilon
    fp32_master: true
    gradient: ste
    gradient_ablations: [autograd, inverse_sqrt_n, inverse_sqrt_7n, lr_only]
  ternary:
    paper_twn:
      status: static_proxy_implemented
      delta: 0.7_mean_absolute_weight
      alpha: mean_absolute_selected_weight
    channel_twn: planned_not_implemented
    ttq: planned_not_implemented
  activation_sd4:
    status: later_matched_research
    cells: [lsq_plus_a4, fixed_signed_a_sd4, learnable_range_a_sd4]

