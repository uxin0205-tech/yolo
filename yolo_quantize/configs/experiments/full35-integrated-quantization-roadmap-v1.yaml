protected_contract:
  binary_qk: keep_existing_bittrue_implementation
  masf: keep_topology_and_semantics
  attention_pwl: keep_existing_implementation
  never_general_quantize: [topk, gather, box_decode, keypoint_decode]
  dfl: absent_because_reg_max_is_1
  nms: absent_from_end_to_end_one_to_one_deployment
  training_only_branches_not_counted_as_deployment_savings: [one2many, pose_flow, pose_sigma]

algorithm_contract:
  twn_v2_0_70_layerwise_static_proxy:
    levels: [-alpha, '0', +alpha]
    threshold: 0.7_times_mean_absolute_weight
    alpha: mean_absolute_selected_weight
    granularity: per_tensor
    bits: 2
    role: frozen_project_static_control
    paper_faithfulness: simplified_proxy_not_full_reproduction
    reason: 原論文以FP32 shadow weights訓練且以filter為單位；現有結果是layer-wise PTQ套用。
  twn_v3_0_75_filterwise_static_initialization:
    levels: [-alpha, '0', +alpha]
    threshold: 0.75_times_filter_mean_absolute_weight
    granularity: per_output_filter
    bits: 2
    role: cpu_ablation_and_faithful_qat_initialization
    implementation_status: completed_cpu_profile
  exact_scaled_ternary_ptq:
    levels: [-scale, '0', +scale]
    scale_method: optimal_scaled_codebook
    granularity: per_tensor
    bits: 2
    role: required_strong_ptq_comparator
    implementation_status: completed_cpu_profile
  learned_alpha_layerwise_twn_qat:
    role: project_recovery_extension_not_faithful_paper_result
    selection_rule: paper_threshold
    scale: learned_positive_layer_scale
    progressive_schedule: [fp32_3_epochs, ramp_6_epochs, full_ternary_6_epochs]
  faithful_filterwise_twn_qat:
    role: paper_aligned_full_precision_shadow_weight_training
    scale_and_threshold_granularity: per_output_filter
    versions: [twn_v2_0_70, twn_v3_0_75]
    implementation_status: implemented_conditionally_queued
  channel_twn:
    role: separate_qat_upper_bound
    must_not_be_named_paper_twn: true
  ttq:
    role: separate_positive_and_negative_scale_qat
    must_not_be_named_paper_twn: true

workflow:
  - stage: 0
    name: finish_current_w8_qat
    state: completed_locked_v19_epoch5
    action: 已以patience=5合法early stop；鎖定V19 epoch-5 full-resume與inference checkpoints。
  - stage: 1
    name: cpu_ternary_baselines
    state: completed
    gpu: false
    action: 已對148個deployment paths完成exact W4、Fixed-SD4、TWN-v2、TWN-v3 filter-wise與exact-scaled ternary，共740格；只作排序。
    winner_selection: false
  - stage: 2
    name: lock_backbone
    state: completed_in_v29_queue
    plan: configs/experiments/v29-v19-progressive-ptq-queue-v1.yaml
    rule: 一次只替換一個path；不通過即保留V19 W8並進下一區。
  - stage: 3
    name: lock_neck
    state: completed_in_v29_queue
    rule: 在固定backbone結果上逐path測neck、MASF weight與neck attention safe；不得相加isolated delta。
  - stage: 4
    name: lock_heads
    state: completed_in_v29_queue
    rule: 在固定backbone+neck結果上依Detect tower、Detect predictor、Pose tower、Pose predictor逐步替換。
  - stage: 5
    name: matched_weight_recovery_lanes
    state: executing_seven_paired_short_qat_jobs
    lanes:
      uniform_mixed:
        scope: W8與既有mixed-bit recover candidates
        rule: 保留V19與既有mixed-bit evidence，不因新增ternary重跑已完成PTQ。
      sd4:
        scope: Fixed-SD4 Detect predictor/head與matched LS-SD4
        rule: 固定codebook control與learned-scale recovery分開歸因。
      ternary:
        scope: staged backbone→neck→head的Paper/exact ternary recover candidates
        rule: 只讓search-val為recover且有實質容量收益者進短QAT；green PTQ不強制重訓，reject不直接進長訓練。
    convergence: 三條lane各保留最多accuracy/balanced/hardware角色，再做跨lane Pareto。
  - stage: 6
    name: activation_weight_coupling
    state: pending_stage5
    rule: qSiLU先依V30跑完整平行weight流程；完成poly_shift與qSiLU各自Pareto後，再把最多三個locked policies接到uniform Hardswish與Q3 regional Hardswish重驗。weight policy鎖定後才試A7/A6。
    lower_activation_bits:
      primary: [a8]
      later_search: [a7, a6]
      a_sd4: separate_research_branch_after_weight_map
  - stage: 7
    name: formal_and_export
    state: pending_locked_finalists
    rule: 最多三個locked finalists進multi-seed、formal validation、packing與target hardware量測。

stage_locking:
  order: [backbone, neck, head]
  accepted_action_when_no_ternary_cell_passes: retain_previous_w8_or_fp32_policy
  rollback: 任一累積cell失敗即回到上一個green checkpoint或PTQ policy。
  intermediate_reserve:
    before_head_map50_required_headroom: 0.002
    before_head_map50_95_required_headroom: 0.005
  final_hard_gate_overrides_reserve: true

evaluation:
  screening:
    coco: full_val_5000
    bbat5: canonical_search_val_600
    formal_validation: false
    augmentation: false
  metric_keys_map50:
    - coco/box/map50
    - coco/person/box/map50
    - bbat/box/map50
    - bbat/pose/map50
    - bbat/ball/box/map50
    - bbat/bat/box/map50
    - bbat/ball/pose/map50
    - bbat/bat/pose/map50
  matched_controls_per_exact_path_set:
    - locked_parent_unchanged
    - exact_uniform_w4
    - twn_v2_0_70_layerwise_static_proxy
    - twn_v3_0_75_filterwise_static_initialization
    - exact_scaled_ternary

training_if_needed:
  from_scratch: false
  primary_optimizer: AdamW
  detect_logical_batch: 128
  detect_physical_batch: 16
  pose_physical_batch: 16
  loss_weights: {detect: 1.0, pose: 0.25}
  augmentation: accepted_full35_exact
  added_noise: false
  short_ternary_candidates_maximum: 8
  short_ternary_roles: {main: 6, sentinels: 2}
  short_epochs: 15
  patience: 5
  progressive_inq_style_ablation:
    role: fallback_after_direct_progressive_qat
    fractions_percent: [20, 40, 60, 70, 80, 85, 90, 95, 97.5, 100]
    note: 借用INQ的layer內逐步量化概念；backbone到neck到head仍是本專案外層順序，不宣稱為INQ原實驗。
  extended_epochs: [20, 60]
  extended_only_after_short_recovery: true
  musgd: separate_matched_sham_pilot_only

stopping_rules:
  do_not_launch_gpu_ternary_without_locked_parent: true
  do_not_use_static_nrmse_to_promote_without_map: true
  do_not_search_formal_validation: true
  do_not_claim_native_speed_without_kernel_and_hardware_measurement: true
  do_not_run_final_optimizations_before_base_finalists: true
