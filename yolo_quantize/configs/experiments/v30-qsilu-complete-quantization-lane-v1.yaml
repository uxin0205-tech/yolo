    recovery_floors: {map50: -0.04, map50_95: -0.08}
    maximum_jobs: {main: 6, sentinel: 2}
    arms: [matched_sham, qat]
  - id: q7
    name: activation_weight_pareto_comparison
    gpu: false
    state: pending_q6
    depends_on: [q6]
    report: artifacts/reports/v30-qsilu-complete-lane-summary-v1.json
    compare_with: v29_poly_shift_complete_lane
    action: 只比較相同資料、16指標、QAT預算與packing定義；不得把兩個activation各自孤立最佳直接拼接。

training:
  optimizer: AdamW
  optimizer_state: fresh_per_paired_experiment
  weight_decay: 0.00027
  betas: [0.948, 0.999]
  detect_logical_batch: 128
  detect_physical_microbatch: 16
  pose_batch: 16
  loss_weights: {detect: 1.0, pose: 0.25}
  augmentation: accepted_full35_exact
  added_noise: false
  all_w8_qat:
    epochs_max: 15
    patience: 5
    warmup_epochs: 3
    scale_only_epochs: 5
    progressive_schedule: {start_epoch: 0, full_epoch: 5}
  recovery_qat:
    epochs_max: 15
    patience: 5
    warmup_epochs: 1
    schedule: {fp32_blend_epochs: 3, ramp_epochs: 6, full_quant_epochs: 6}

deferred_until_finalists_confirmed:
  - a7_or_a6_activation_search
  - activation_sd4_research_branch
  - 20_or_60_epoch_extension
  - musgd_matched_pilot
  - multi_seed
  - formal_validation
  - export_and_hardware_measurement

handoff:
