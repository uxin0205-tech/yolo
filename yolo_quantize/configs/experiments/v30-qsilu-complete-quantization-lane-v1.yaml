  - id: q1
    name: qsilu_all_ten_regions_w8_ptq
    gpu: true
    state: reviewed_plan_ready_waiting_dependency
    depends_on: [q0]
    reviewed_plan: configs/experiments/v30-qsilu-all-ten-regions-w8-search-v1.yaml
    output: artifacts/reports/v30-qsilu-all-ten-regions-w8-search-v1.json
    dual_output: artifacts/reports/v30-qsilu-all-ten-regions-w8-dual-regate-v1.json
    action: 在qSiLU+A8 checkpoint上把十區148個deployment paths同時套W8，補齊舊九區證據缺口。
    formats: [{family: uniform, bits: 8, scale_method: mse_grid_v1}]
    output_gate: [green, recover]
  - id: q2
    name: qsilu_all_w8_paired_qat
    gpu: true
    state: conditional_q1_green_or_recover
    depends_on: [q1]
    arms: [matched_sham, qat]
    materialized_plan: artifacts/queues/v30-qsilu-complete-quantization-lane-v1/generated/v30-qsilu-all-w8-qat-pilot-v1.yaml
    preflight: artifacts/queues/v30-qsilu-complete-quantization-lane-v1/q2-preflight.json
    action: 以qSiLU自身checkpoint訓練all-W8；不得接用poly_shift的V19 weight checkpoint。
  - id: q3
    name: lock_qsilu_all_w8_parent
    gpu: false
    state: pending_q2
    manifest: artifacts/manifests/v30-qsilu-all-w8-locked-parent-v1.yaml
    action: 只鎖定通過雙門檻的best_joint epoch、full-resume與inference SHA-256。
  - id: q4
    name: qsilu_148_by_8_cpu_profile
    gpu: false
    state: pending_q3
    output: artifacts/reports/v30-qsilu-all-w8-progressive-weight-formats-cpu-v1.json
    profile_id: v30-qsilu-all-w8-progressive-weight-formats-cpu-v1
    coverage: 148_paths_x_8_formats
    formats: [exact_w7, exact_w6, exact_w5, exact_w4, fixed_sd4, paper_twn_v2, twn_v3_filterwise, exact_scaled_ternary]
    action: 只排序候選，不以NRMSE直接promotion。
  - id: q5
    name: qsilu_progressive_ptq
    gpu: true
    state: pending_q4
    depends_on: [q3, q4]
    materialized_plan: artifacts/queues/v30-qsilu-complete-quantization-lane-v1/generated/v31-qsilu-progressive-ptq-queue-v1.yaml
    run_root: artifacts/queues/v31-qsilu-progressive-ptq-to-short-qat-v1
    order:
      - backbone_early
      - backbone_deep
      - backbone_attention_safe_sentinel
      - neck
      - masf
      - neck_attention_safe
      - detect_one2one_tower
      - detect_one2one_predictor
      - pose_one2one_tower
      - pose_one2one_predictor_diagnostic
    formats_per_selected_path: [exact_w7, exact_w6, exact_w5, exact_w4, fixed_sd4, paper_twn_v2, twn_v3_filterwise, exact_scaled_ternary]
    rule: 每次只在上一個green parent加入一個path；失敗保留上一版並繼續下一區。
  - id: q6
    name: qsilu_corrected_recovery_regate_and_short_qat
    gpu: mixed
    state: pending_q5
    depends_on: [q5]
    output_root: artifacts/queues/v31-qsilu-progressive-ptq-to-short-qat-v1/short-qat
