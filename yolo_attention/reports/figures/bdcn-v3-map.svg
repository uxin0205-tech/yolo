<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">BDCN V2 and V3 mAP50-95 comparison</title>
  <desc id="desc">Bar chart comparing V2 learned, V2 R1, V3 fixed, V3 learned, and V3 R1.</desc>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="45" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#172033">BDCN 缺陷修正：COCO2017 mAP50-95</text>
  <text x="480" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#526079">相同 A0 parent；V3 將 fixed table 與 codebook learning 分離</text>
  <line x1="105" y1="445" x2="905" y2="445" stroke="#27344d" stroke-width="2"/>
  <line x1="105" y1="105" x2="105" y2="445" stroke="#27344d" stroke-width="2"/>
  <g font-family="sans-serif" font-size="13" fill="#526079">
    <text x="92" y="449" text-anchor="end">0.47</text><text x="92" y="364" text-anchor="end">0.48</text>
    <text x="92" y="279" text-anchor="end">0.49</text><text x="92" y="194" text-anchor="end">0.50</text>
    <text x="92" y="109" text-anchor="end">0.51</text>
  </g>
  <g stroke="#dce2ec"><line x1="105" y1="360" x2="905" y2="360"/><line x1="105" y1="275" x2="905" y2="275"/><line x1="105" y1="190" x2="905" y2="190"/><line x1="105" y1="105" x2="905" y2="105"/></g>
  <g>
    <rect x="145" y="332.1" width="110" height="112.9" rx="5" fill="#d15c5c"/>
    <rect x="300" y="330.8" width="110" height="114.2" rx="5" fill="#d98555"/>
    <rect x="455" y="134.7" width="110" height="310.3" rx="5" fill="#2f8f74"/>
    <rect x="610" y="135.5" width="110" height="309.5" rx="5" fill="#4f86c6"/>
    <rect x="765" y="134.7" width="110" height="310.3" rx="5" fill="#7656b5"/>
  </g>
  <g font-family="sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="middle">
    <text x="200" y="319">0.483281</text><text x="355" y="318">0.483500</text><text x="510" y="122">0.506566</text><text x="665" y="123">0.506469</text><text x="820" y="122">0.506562</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#27344d" text-anchor="middle">
    <text x="200" y="470">V2-LEARN</text><text x="355" y="470">V2-R1</text><text x="510" y="470">V3-FIXED</text><text x="665" y="470">V3-LEARN</text><text x="820" y="470">V3-R1</text>
  </g>
  <text x="480" y="515" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#526079">V3 fixed 恢復 2.329 AP；bounded learning 無額外收益；R1 reciprocal LUT 幾乎無損</text>
</svg>
